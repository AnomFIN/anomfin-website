<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main symbol - Professional datacenter/network icon -->
  <rect x="20" y="20" width="80" height="80" fill="url(#logoGrad)" rx="16"/>
  
  <!-- Center connection hub -->
  <circle cx="60" cy="60" r="8" fill="white"/>
  
  <!-- Network connection lines -->
  <line x1="35" y1="35" x2="85" y2="85" stroke="white" stroke-width="3"/>
  <line x1="85" y1="35" x2="35" y2="85" stroke="white" stroke-width="3"/>
  <line x1="40" y1="60" x2="80" y2="60" stroke="white" stroke-width="3"/>
  <line x1="60" y1="40" x2="60" y2="80" stroke="white" stroke-width="3"/>
  
  <!-- Network nodes -->
  <circle cx="35" cy="35" r="4" fill="white"/>
  <circle cx="85" cy="35" r="4" fill="white"/>
  <circle cx="35" cy="85" r="4" fill="white"/>
  <circle cx="85" cy="85" r="4" fill="white"/>
  <circle cx="40" cy="60" r="4" fill="white"/>
  <circle cx="80" cy="60" r="4" fill="white"/>
  <circle cx="60" cy="40" r="4" fill="white"/>
  <circle cx="60" cy="80" r="4" fill="white"/>
</svg>